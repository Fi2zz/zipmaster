name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14   # arm64（Apple Silicon）
    steps:
      - uses: actions/checkout@v4

      - name: Cache arm64 engines
        uses: actions/cache@v4
        with:
          path: Sources/ZipMaster/Resources/Engines
          key: engines-${{ runner.os }}-${{ hashFiles('scripts/build-engines.sh') }}

      - name: Build engines (7zz + unrar, arm64)
        run: ./scripts/build-engines.sh

      - name: Test
        run: swift test

      - name: Build ZipMaster.app
        run: ./scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --keepParent ZipMaster.app ZipMaster.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipMaster-app
          path: ZipMaster.zip
